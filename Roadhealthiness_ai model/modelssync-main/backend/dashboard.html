<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart City Command Center</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151a28;
            --accent-pothole: #ef4444;
            --accent-env: #3b82f6;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
        }

        header {
            background-color: rgba(21, 26, 40, 0.9);
            backdrop-filter: blur(10px);
            padding: 1.5rem 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            color: #10b981;
            background: rgba(16, 185, 129, 0.1);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .pulse {
            width: 8px;
            height: 8px;
            background-color: #10b981;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .container {
            max-width: 1400px;
            margin: 2rem auto;
            padding: 0 1rem;
            display: flex;
            gap: 2rem;
        }

        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .column-header {
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .column-header.potholes { color: var(--accent-pothole); border-color: rgba(239, 68, 68, 0.3); }
        .column-header.env { color: var(--accent-env); border-color: rgba(59, 130, 246, 0.3); }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.4);
        }
        
        .card.pothole-card:hover { border-color: rgba(239, 68, 68, 0.3); }
        .card.env-card:hover { border-color: rgba(59, 130, 246, 0.3); }

        .image-container {
            position: relative;
            width: 100%;
            height: 250px;
            background: #000;
        }

        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .severity-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 800;
            text-transform: uppercase;
        }
        
        .severity-badge.pothole-badge { background: var(--accent-pothole); box-shadow: 0 4px 10px rgba(239, 68, 68, 0.4); }
        .severity-badge.env-badge { background: var(--accent-env); box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4); }

        .card-content {
            padding: 1.5rem;
        }

        .meta {
            display: flex;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .location {
            font-family: monospace;
            background: rgba(0,0,0,0.3);
            padding: 8px 12px;
            border-radius: 6px;
            color: #60a5fa;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        .trash-tags {
            margin-top: 10px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .trash-tag {
            background: rgba(59, 130, 246, 0.2);
            color: #93c5fd;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .empty-state {
            text-align: center;
            padding: 4rem 1rem;
            color: var(--text-muted);
        }
        
        .empty-state h2 {
            color: var(--text-main);
            margin-bottom: 10px;
        }

    </style>
</head>
<body>

    <header>
        <h1>🌍 Smart City Command Center</h1>
        <div class="status">
            <div class="pulse"></div>
            Dual-AI System Online
        </div>
    </header>

    <div class="container">
        <!-- Road Hazards Column -->
        <div class="column">
            <div class="column-header potholes">🛑 Pothole Detector</div>
            <div class="grid" id="pothole-feed">
                <div class="empty-state">
                    <h2>No Potholes Detected</h2>
                    <p>Monitoring road surface...</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        const potholeFeed = document.getElementById('pothole-feed');
        
        let knownPotholes = new Set();

        async function fetchDetections() {
            try {
                const res = await fetch('/api/feed?t=' + new Date().getTime(), { cache: "no-store" });
                const data = await res.json();
                
                // --- Process Potholes ---
                if (data.potholes && data.potholes.length > 0 && knownPotholes.size === 0) {
                    potholeFeed.innerHTML = '';
                }

                (data.potholes || []).forEach(item => {
                    const id = item.timestamp + '_' + item.location.lat;
                    if (!knownPotholes.has(id)) {
                        knownPotholes.add(id);
                        
                        const date = new Date(item.timestamp * 1000).toLocaleTimeString();
                        const confidence = (item.confidence * 100).toFixed(1);
                        
                        const card = document.createElement('div');
                        card.className = 'card pothole-card';
                        card.innerHTML = `
                            <div class="image-container">
                                <img src="${item.image_url}" alt="Detected Pothole">
                                <div class="severity-badge pothole-badge">${item.size}</div>
                            </div>
                            <div class="card-content">
                                <div class="meta">
                                    <span>Time: ${date}</span>
                                    <span>Confidence: ${confidence}%</span>
                                </div>
                                <div class="location">📍 ${item.address ? item.address : `Lat: ${item.location.lat.toFixed(6)}, Lng: ${item.location.lng.toFixed(6)}`}</div>
                                <a href="https://www.google.com/maps?q=${item.location.lat},${item.location.lng}" target="_blank" style="display:inline-block; margin-top:10px; padding:8px 12px; background:var(--accent-pothole); color:#000; text-decoration:none; border-radius:8px; font-weight:600; font-size: 13px; text-align:center; width:100%; box-sizing:border-box;">🗺️ Open in Google Maps</a>
                            </div>
                        `;
                        potholeFeed.insertBefore(card, potholeFeed.firstChild);
                    }
                });


            } catch (err) {
                console.error("Failed to fetch feed", err);
            }
        }

        // Poll every 2 seconds
        setInterval(fetchDetections, 2000);
        fetchDetections();
    </script>
</body>
</html>
